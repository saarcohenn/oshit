services:
  oshit:
    build: .
    # אחרי דחיפה ל-GHCR אפשר למשוך במקום לבנות:
    #   docker compose pull && docker compose up -d
    image: ghcr.io/saarcohenn/oshit:latest
    container_name: oshit
    ports:
      # הרשת הביתית בלבד — אין שכבת הזדהות, ראו README
      # אותו פורט כמו בהומלאב, כדי שלא יהיו הפתעות בין סביבות
      - "8082:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
    volumes:
      - oshit-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  oshit-data:
