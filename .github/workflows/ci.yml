name: CI

# בדיקות בלבד. רץ גם על Pull Request מ-fork, ולכן אין כאן שום secret,
# אין הרשאת כתיבה, ולא נדחפת תמונה לשום מקום.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: התקנת תלויות הלקוח
        run: npm --prefix client ci || npm --prefix client install

      # חולשה ברמה high ומעלה בתלות שנשלחת למשתמש מפילה את ה-PR
      - name: בדיקת חולשות — לקוח
        run: npm --prefix client audit --omit=dev --audit-level=high

      # הפרסר הוא נתיב הכסף, והבאג בו שקט: מספר סביר שאיש לא יבחין בו
      - name: בדיקות — לקוח
        run: npm --prefix client test

      - name: בדיקת טיפוסים ובנייה — לקוח
        run: npm --prefix client run build

      - name: התקנת תלויות השרת
        run: npm --prefix server ci || npm --prefix server install

      - name: בדיקת חולשות — שרת
        run: npm --prefix server audit --omit=dev --audit-level=high

      # צינור הסוכנים: הטוקן, הוולידציה והשמירה. רץ על מסד זמני
      - name: בדיקות — שרת
        run: npm --prefix server test

      - name: בדיקת טיפוסים ובנייה — שרת
        run: npm --prefix server run build

      - name: התקנת תלויות הסוכנים
        run: npm --prefix agents ci

      - name: בדיקת חולשות — סוכנים
        run: npm --prefix agents audit --omit=dev --audit-level=high

      # מדדים, תזמון ופענוח הדוח. בלי קריאה אמיתית ל-API
      - name: בדיקות — סוכנים
        run: npm --prefix agents test

      - name: בדיקת טיפוסים ובנייה — סוכנים
        run: npm --prefix agents run build

      # בנייה בלבד, בלי push — מוודאת שה-Dockerfile תקין גם ב-PR
      - name: בניית תמונת דוקר
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: בניית תמונת הסוכנים
        uses: docker/build-push-action@v7
        with:
          context: agents
          push: false
          cache-from: type=gha,scope=agents
          cache-to: type=gha,mode=max,scope=agents
